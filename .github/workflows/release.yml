name: Release

# Builds the three platform binaries and attaches them to a GitHub release.
#
#   git tag -a v1.0.0 -m "1.0.0" && git push origin v1.0.0
#
# Pushing a `v*` tag builds and publishes in one go. `workflow_dispatch` builds
# the same three assets without publishing (leave the tag input empty), which is
# the way to check that the matrix is green before cutting a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ASSET_STEM: auto-update-cloud-firewall

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            built: auto-update-cloud-firewall.exe
          - platform: darwin
            os: macos-15-intel
            triple: x86_64-apple-darwin
            built: auto-update-cloud-firewall
          - platform: linux
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            built: auto-update-cloud-firewall
    steps:
      - uses: actions/checkout@v4

      # gpui links GTK, xkbcommon, fontconfig/freetype and Wayland; the tray
      # needs the Ayatana appindicator headers.
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config clang libclang-dev libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      # Windows is the reference platform for lint policy; the other two only
      # have to compile and pass the test suite, which is what makes them
      # shippable as "unverified" in the release notes.
      - name: Check formatting
        if: matrix.platform == 'windows'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.platform == 'windows'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --target ${{ matrix.triple }}

      - name: Build
        run: cargo build --release --target ${{ matrix.triple }}

      - name: Stage the platform-named asset
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TRIPLE: ${{ matrix.triple }}
          BUILT: ${{ matrix.built }}
        run: |
          set -euo pipefail
          # Only Windows carries an extension; macOS and Linux stay extensionless.
          asset="${ASSET_STEM}-x86_64-${PLATFORM}"
          if [ "${PLATFORM}" = "windows" ]; then asset="${asset}.exe"; fi
          mkdir -p dist
          cp -f "target/${TRIPLE}/release/${BUILT}" "dist/${asset}"
          chmod +x "dist/${asset}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-asset
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve the tag and the multilingual notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          version="${tag#v}"
          notes="docs/releases/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing release notes: $notes"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/*
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes-file "$NOTES"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$VERSION" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
          gh release view "$TAG" --json tagName,url,assets \
            -q '"release \(.tagName) \(.url)", (.assets[].name)'
